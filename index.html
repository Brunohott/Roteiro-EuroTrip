<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Roteiro">

<link rel="manifest" href="manifest.webmanifest">

<title>Roteiro 29/10 → 10/11/2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F7FA;
    --card:#FFFFFF;
    --ink:#18222F;
    --soft:#6A7584;
    --line:#E4E9EF;
    --sea:#2A6A96;
    --sea-soft:#E3EEF6;
    --ok:#2F8A62;
    --ok-soft:#E4F3EC;
    --warn-soft:#FBF3DF;
    --warn:#8A6412;
    --sky1:#C9DDEE;
    --sky2:#F1E4D6;
    --far:#A9C0D6;
    --near:#6F8FAD;
    --font:"Plus Jakarta Sans","Avenir Next",-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1620; --card:#17212D; --ink:#E8EEF4; --soft:#93A1B2; --line:#243242;
      --sea:#7DB5DC; --sea-soft:#1C3143; --ok:#62C497; --ok-soft:#173327;
      --warn-soft:#2C2515; --warn:#E3C074;
      --sky1:#1B2C42; --sky2:#3A2F3A; --far:#2C4460; --near:#3E5D7E;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1620; --card:#17212D; --ink:#E8EEF4; --soft:#93A1B2; --line:#243242;
    --sea:#7DB5DC; --sea-soft:#1C3143; --ok:#62C497; --ok-soft:#173327;
    --warn-soft:#2C2515; --warn:#E3C074;
    --sky1:#1B2C42; --sky2:#3A2F3A; --far:#2C4460; --near:#3E5D7E;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{padding-top:0;padding-bottom:env(safe-area-inset-bottom,0px)}
  html,body{margin:0}
  html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--font);
    font-size:17px;line-height:1.5;
    padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 20px}

  /* ---------- hero: horizonte da viagem ---------- */
  .hero{
    position:relative;overflow:hidden;
    background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 100%);
    padding-top:calc(env(safe-area-inset-top,0px) + 36px);
  }
  .hero .wrap{position:relative;z-index:2;padding-bottom:210px}
  .hero h1{font-size:clamp(34px,7vw,56px);font-weight:800;letter-spacing:-.03em;line-height:1.02;margin:0}
  .hero .dates{font-size:16px;color:var(--soft);margin:10px 0 22px;font-weight:500}
  .progress{display:flex;align-items:center;gap:14px;max-width:420px}
  .track{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.55);overflow:hidden}
  :root[data-theme="dark"] .track{background:rgba(255,255,255,.12)}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .track{background:rgba(255,255,255,.12)}}
  .track i{display:block;height:100%;width:0;background:var(--sea);border-radius:99px;transition:width .5s ease}
  .progress b{font-size:15px;font-weight:700;min-width:44px;text-align:right}
  .progress small{display:block;font-size:13px;color:var(--soft);margin-top:6px}
  .skyline{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:230px;z-index:1}
  .skyline .far{color:var(--far)} .skyline .near{color:var(--near)} .skyline .ground{fill:var(--bg)}

  /* ---------- navegação por dia ---------- */
  nav{
    position:sticky;top:0;z-index:20;
    padding-top:env(safe-area-inset-top,0px);
    background:color-mix(in srgb,var(--bg) 88%,transparent);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .days{display:flex;gap:8px;overflow-x:auto;padding:12px 20px;scrollbar-width:none;max-width:760px;margin:0 auto}
  .days::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);
    font:600 14px/1 var(--font);padding:10px 14px;border-radius:99px;cursor:pointer;white-space:nowrap
  }
  .chip.today{border-color:var(--sea);color:var(--sea)}
  .chip.done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
  .chip.done::before{content:"✓ "}
  .chip.pend{background:var(--warn-soft);border-color:transparent;color:var(--warn)}

  /* ---------- dias ---------- */
  #list{padding-top:24px}
  .day{
    position:relative;overflow:hidden;background:var(--card);
    border-radius:24px;margin:0 0 18px;border:1px solid var(--line);
  }
  .day-head{position:relative;display:flex;gap:16px;align-items:flex-start;padding:22px 22px 14px;min-height:118px}
  .day-head .art{
    position:absolute;right:-4px;top:10px;height:150px;width:auto;
    color:var(--sea);opacity:.15;pointer-events:none
  }
  .date{flex:0 0 auto;text-align:center;min-width:52px}
  .date .n{font-size:36px;font-weight:800;letter-spacing:-.04em;line-height:1}
  .date .m{font-size:13px;color:var(--soft);font-weight:600;margin-top:4px}
  .date .flag{font-size:22px;margin-top:6px;line-height:1}
  .titles{position:relative;flex:1;min-width:0;padding-right:80px}
  .titles h2{font-size:23px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin:2px 0 4px}
  .titles .where{font-size:15px;color:var(--soft)}
  .titles .count{display:inline-block;margin-top:10px;font-size:13px;font-weight:600;color:var(--soft)}
  .day.done .titles .count{color:var(--ok)}
  .day.done .titles .count::before{content:"✓ "}
  .note{
    margin:0 22px 8px;padding:12px 14px;border-radius:14px;
    background:var(--warn-soft);color:var(--warn);font-size:15px;line-height:1.45
  }
  .group{font-size:15px;font-weight:700;margin:18px 22px 4px}
  .items{padding:4px 10px 12px}
  .item{
    width:100%;text-align:left;border:0;background:none;color:inherit;font:inherit;margin:0;
    -webkit-appearance:none;appearance:none;
    display:flex;align-items:flex-start;gap:14px;padding:12px;border-radius:14px;cursor:pointer;
    transition:background .15s
  }
  .item:active{background:var(--sea-soft)}
  .item{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  .item *{pointer-events:none}
  .box{
    flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);
    margin-top:1px;display:grid;place-items:center;transition:all .2s
  }
  .box svg{width:14px;height:14px;opacity:0;transform:scale(.4);transition:all .2s}
  .item.on .box{background:var(--ok);border-color:var(--ok)}
  .item.on .box svg{opacity:1;transform:scale(1)}
  .time{flex:0 0 46px;font-size:15px;font-weight:600;color:var(--sea);font-variant-numeric:tabular-nums;padding-top:2px}
  .time:empty{visibility:hidden}
  .notime .time{display:none}
  .txt{flex:1;font-size:17px;padding-top:1px}
  .tag{
    display:inline-block;margin-left:6px;font-size:12px;font-weight:600;color:var(--sea);
    background:var(--sea-soft);padding:2px 8px;border-radius:99px;vertical-align:2px
  }
  .item.on .txt{color:var(--soft);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--soft) 60%,transparent)}
  .item.on .time{color:var(--soft)}

  footer{
    display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
    padding:18px 2px 60px;color:var(--soft);font-size:14px
  }
  #sync{font-weight:600}
  button.reset{
    font:600 14px var(--font);background:none;border:1px solid var(--line);color:var(--soft);
    padding:10px 16px;border-radius:99px;cursor:pointer
  }
  button:focus-visible,.item:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
  @media (max-width:520px){
    .titles{padding-right:40px}
    .day-head .art{height:86px;opacity:.1}
    .hero .wrap{padding-bottom:96px}
    .skyline{height:170px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

const ART = {
  prep:"mala", d2910:"aviao", d3010:"alcala", d3110:"alcala", d0111:"estadio",
  d0211:"sagrada", d0311:"navio", d0411:"garde", d0511:"savona",
  d0611:"aviao", d0711:"eiffel", d0811:"eiffel", d0911:"estadio", d1011:"penha"
};
const MES = {OUT:"out", NOV:"nov"};

const KEY = "roteiro_2026_check";
let state = {};

const LKEY = KEY + "_local";
let dbRef = null;
let dirty = false;          // há mudança local ainda não confirmada na nuvem
let lastLocalChange = 0;    // quando o usuário marcou algo pela última vez
let pushing = false, syncTimer = null;

function lsGet(k){ try{ return window.localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ window.localStorage.setItem(k,v); return true; }catch(e){ return false; } }

function setSync(txt){ const el=document.getElementById("sync"); if(el) el.textContent=txt; }

const store = {
  loadLocal(){
    const v = lsGet(LKEY) || lsGet(KEY);
    try{ const o = v ? JSON.parse(v) : {}; return o && typeof o==="object" ? (o.state||o) : {}; }catch(e){ return {}; }
  },
  save(o){
    dirty = true;
    lastLocalChange = Date.now();
    const okLocal = lsSet(LKEY, JSON.stringify({state:o, t:lastLocalChange}));
    setSync(okLocal ? "Salvo no iPad" : "Marcado");
    clearTimeout(syncTimer);
    syncTimer = setTimeout(pushRemote, 400);
  }
};

async function pushRemote(){
  if(!dbRef || pushing){ return; }
  pushing = true;
  const sentAt = lastLocalChange;
  try{
    await dbRef.set({ state: JSON.parse(JSON.stringify(state)), t: sentAt });
    if(lastLocalChange === sentAt) dirty = false;
    setSync("Salvo na nuvem ✓");
  }catch(e){
    setSync("Salvo no iPad · nuvem pendente");
  }
  pushing = false;
  if(dirty && lastLocalChange !== sentAt) pushRemote();
}

async function connectCloud(){
  try{
    if(!window.claude || !window.claude.use) return;
    const db = await window.claude.use("db");
    if(!db) return;
    dbRef = db.doc("roteiro/checks");
    dbRef.onSnapshot(snap=>{
      if(dirty || pushing){ pushRemote(); return; }                 // nunca desfaz um toque recente
      if(snap.metadata && snap.metadata.hasPendingWrites) return;
      if(!snap.exists){ if(Object.keys(state).length){ dirty=true; pushRemote(); } return; }
      const d = snap.data() || {};
      const remote = d.state || {};
      const remoteT = d.t || 0;
      if(remoteT <= lastLocalChange) return;                         // versão da nuvem é mais antiga
      if(JSON.stringify(remote) !== JSON.stringify(state)){
        state = remote;
        lsSet(LKEY, JSON.stringify({state, t:remoteT}));
        render();
      }
      setSync("Salvo na nuvem ✓");
    }, ()=> setSync("Salvo no iPad"));
  }catch(e){ /* sem nuvem: segue só local */ }
}

window.addEventListener("online", ()=>{ if(dirty) pushRemote(); });


function todayId(){
  const t = new Date();
  const dd = String(t.getDate()).padStart(2,"0"), mm = String(t.getMonth()+1).padStart(2,"0");
  return t.getFullYear()===2026 ? "d"+dd+mm : null;
}

function render(){
  const list = document.getElementById("list");
  const days = document.getElementById("days");
  list.innerHTML = ""; days.innerHTML = "";
  const hoje = todayId();

  DATA.forEach(day=>{
    const chip = document.createElement("button");
    chip.className = "chip" + (day.id===hoje ? " today" : "");
    chip.dataset.jump = day.id;
    chip.textContent = day.id === "prep" ? "Antes" : (day.id===hoje ? "Hoje" : day.d + " " + MES[day.m]);
    days.appendChild(chip);

    const card = document.createElement("section");
    card.className = "day";
    card.id = day.id;

    let h = '<div class="day-head">'+
      '<svg class="art" viewBox="0 0 200 150" aria-hidden="true"><use href="#'+(ART[day.id]||"mala")+'" width="200" height="150"/></svg>'+
      '<div class="date">'+
        (day.d ? '<div class="n">'+day.d+'</div><div class="m">'+MES[day.m]+' · '+day.w.slice(0,3).toLowerCase()+'</div>'
               : '<div class="n" style="font-size:28px">🧳</div>')+
        (day.d ? '<div class="flag">'+day.f+'</div>' : '')+
      '</div>'+
      '<div class="titles"><h2>'+day.title+'</h2><div class="where">'+day.where+'</div>'+
      '<span class="count" data-count="'+day.id+'"></span></div></div>';
    if(day.note) h += '<div class="note">'+day.note+'</div>';

    day.groups.forEach((grp,gi)=>{
      if(grp.g) h += '<div class="group">'+grp.g+'</div>';
      const noTime = grp.items.every(it=>!it.t);
      h += '<div class="items'+(noTime?' notime':'')+'">';
      grp.items.forEach((it,ii)=>{
        const key = day.id+"-"+gi+"-"+ii;
        h += '<button type="button" class="item'+(state[key]?" on":"")+'" data-k="'+key+'" aria-pressed="'+(!!state[key])+'">'+
             '<span class="box"><svg viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'+
             '<span class="time">'+(it.t||"")+'</span>'+
             '<span class="txt">'+it.x+(it.key&&day.id!=='prep'?'<span class="tag">importante</span>':'')+'</span></button>';
      });
      h += '</div>';
    });
    card.innerHTML = h;
    list.appendChild(card);
  });
  refresh();
}

function refresh(){
  let total=0, done=0;
  DATA.forEach(day=>{
    let dt=0, dd=0;
    day.groups.forEach((grp,gi)=>grp.items.forEach((it,ii)=>{ dt++; if(state[day.id+"-"+gi+"-"+ii]) dd++; }));
    total+=dt; done+=dd;
    const complete = dd===dt && dt>0;
    document.getElementById(day.id).classList.toggle("done", complete);
    const c = document.querySelector('[data-count="'+day.id+'"]');
    if(c) c.textContent = complete ? "Dia concluído" : dd+" de "+dt+" feitos";
    const chip = document.querySelector('[data-jump="'+day.id+'"]');
    chip.classList.toggle("done", complete);
    chip.classList.toggle("pend", day.id==="prep" && !complete);
  });
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById("bar").style.width = pct+"%";
  document.getElementById("count").textContent = done+" de "+total+" itens feitos";
  document.getElementById("pct").textContent = pct+"%";
}

function toggle(item){
  const k = item.dataset.k;
  state[k] = !state[k];
  if(!state[k]) delete state[k];
  item.classList.toggle("on", !!state[k]);
  item.setAttribute("aria-pressed", !!state[k]);
  refresh();
  store.save(state);
}

function up(el, test){
  while(el && el !== document){ if(el.nodeType===1 && test(el)) return el; el = el.parentNode; }
  return null;
}
document.addEventListener("click", e=>{
  const jump = up(e.target, el=>el.hasAttribute("data-jump"));
  if(jump){ document.getElementById(jump.dataset.jump).scrollIntoView({behavior:"smooth",block:"start"}); return; }
  const item = up(e.target, el=>el.classList && el.classList.contains("item"));
  if(item) toggle(item);
});


document.getElementById("reset").addEventListener("click", ()=>{
  try{ if(!confirm("Limpar todas as marcações?")) return; }catch(e){}
  state = {};
  store.save(state);
  render();
});

state = store.loadLocal(); render();
connectCloud();
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  navigator.serviceWorker.register("sw.js").then(()=>{},()=>{});
}
(function(){ const h=todayId(); const el=h&&document.getElementById(h); if(el) setTimeout(()=>el.scrollIntoView({block:"start"}),300); })();
</script>
